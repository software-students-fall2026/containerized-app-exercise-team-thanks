{% extends "base.html" %}

{% block title %}Edit Sound · Tactile{% endblock %}

{% block content %}
<a href="{{ url_for('sound_detail', sound_id=sound._id) }}">
    &larr; Back to sound
</a>

<article class="sound-card">
    <h1>Edit Sound</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label for="name">Sound Name</label>
        <input type="text" id="name" name="name"
               value="{{ sound.name }}" required>

        <label for="material">Material</label>
        <input type="text" id="material" name="material"
               value="{{ sound.material }}" required>

        <label for="instrument">Instrument</label>
        <input type="text" id="instrument" name="instrument"
               value="{{ sound.instrument.type if sound.instrument else '' }}"
               required>

        <button type="submit">Save Changes</button>
        <a href="{{ url_for('sound_detail', sound_id=sound._id) }}">
            Cancel
        </a>
    </form>
</article>
{% endblock %}
