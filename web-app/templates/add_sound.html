<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Tactile{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>
        <a href="{{ url_for('home') }}">Back to home</a>
        <form action="{{ url_for('add_sound') }}" method="POST">
            <label for="name">Audio File Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="audio_file">Audio File:</label>
            <input type="file" id="audio_file" name="audio_file" required>

            <button type="submit">Add Sound</button>
        </form>
    </body>
</html>
